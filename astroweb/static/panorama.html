<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>Nachtpanorama · AstroWeb</title><link rel="icon" href="/static/icon.svg"><link rel="stylesheet" href="/static/style.css"><script type="module" src="/static/panorama.js"></script></head>
<body class="pano-page"><header class="pano-header"><div><p class="eyebrow" data-i18n="nightPanorama">Nachtpanorama</p><h1 id="pano-heading"></h1></div><div class="pano-actions"><div class="language" role="group" data-i18n-aria="chooseLanguage"><button data-lang="nl">NL</button><button data-lang="en">EN</button></div><a class="button secondary" id="pano-back" href="/#gallery" data-i18n="backGallery">Terug naar de galerij</a></div></header>
