<!doctype html><html lang="__LANG__" data-mode="__MAP__" data-capture="__CAPTURE__">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; media-src 'self'; object-src 'none'">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#09070b;color:#fff2eb;font:2.1vh Roboto,sans-serif}
[hidden]{display:none!important}#stage,#menu{position:absolute;inset:0;overflow:hidden}#stage{background:#030305}
#menu{background:linear-gradient(90deg,#130c15fa 12%,#190f19e8 46%,#150c1750);display:flex;flex-direction:column;justify-content:center;padding:5vh 6vw}
#menu h1{font-size:5.4vh;font-weight:500;margin:.4em 0}#sub{color:#dfb9aa;min-height:1.35em}#choices{display:grid;gap:1vh;width:fit-content;max-height:65vh;overflow:hidden;padding:3px}
button{font:inherit;color:#eedcd4;background:#2b1d24;text-align:left;border:1px solid #704c4d;border-radius:.7vh;padding:1.1vh 1.6vw;min-width:19vw}
button.active{background:#ffc1a7;color:#211118;border-color:white}#hud{position:absolute;bottom:5vh;left:4vw;max-width:88vw;border-left:3px solid #fcac95;border-radius:.65vh;background:#190f18e8;padding:1.3vh 1.25vw;pointer-events:none}#hud strong{font-size:2.55vh}#hint{color:#e5c5b8;margin-top:.35em;white-space:pre-wrap}#credit{position:absolute;right:3vw;top:3vh;color:#f0ded4;background:#130e15bd;font-size:1.55vh;max-width:65vw}
#stage img,#stage video{position:absolute;display:block;object-fit:contain}#stage canvas{width:100%;height:100%}
.backdrop,.movie{inset:0;width:100%;height:100%}.marker{position:absolute;width:2.7vh;height:2.7vh;border:2px solid #ffe3a6;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 1px #111}
.divider{position:absolute;top:0;bottom:0;width:2px;background:#ffcf9b}#stage .photo-plane{position:absolute;inset:0}#stage .photo-plane.tall{width:100vh;height:100vw;inset:50% auto auto 50%;transform:translate(-50%,-50%) rotate(-90deg)}
@keyframes drift{from{transform:scale(.94)}to{transform:scale(1)}}.glide{animation:drift 25s linear both}
#stage.menu-backdrop img{left:48%;width:52%;height:100%;object-fit:cover}
#menu{background:linear-gradient(90deg,#140d14 38%,#160f19ec 51%,#160f1944 80%);padding-right:47vw}
#sub{color:#ffb59b;font-size:2.25vh}
#choices{overflow-y:auto;max-height:54vh;min-width:26vw;scrollbar-width:none}
#choices button{font-size:2.6vh;padding:1.25vh 1.4vw}
#menu-help{margin-top:2vh;color:#edd1c3;font-size:2.1vh;white-space:pre-line}
#stage .guide-camera{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#stage .guide-camera img{position:absolute;left:0;top:0;transform-origin:0 0}
.guide-ring{position:absolute;width:2.7vh;height:2.7vh;border:2px solid #ffe3a6;border-radius:50%;box-shadow:0 0 0 1px #17111a;transform:translate(-50%,-50%)}
.scene{position:absolute;inset:0;background:#030305;opacity:0;pointer-events:none;transition:opacity .4s ease-in-out}
.scene.visible{opacity:1}
#stage canvas.movie{position:absolute;object-fit:contain}
#stage video::-webkit-media-controls,#stage video::-webkit-media-controls-overlay-play-button{display:none!important}
@media(prefers-reduced-motion:reduce){.scene{transition:none}}
</style>
<div id="stage"></div><div id="menu" hidden><div id="sub"></div><h1></h1><div id="choices"></div><div id="menu-help"></div></div>
<div id="hud" role="status" hidden><strong></strong><div id="hint"></div></div><div id="credit"></div>
<script>__PHOTO_CAMERA__</script><script>__NIGHT_CHART__</script><script>__VIEWING__</script></html>
