services:
  astroweb:
    build: .
    image: astroweb:1.6.9
    restart: unless-stopped
    ports:
      - "${ASTROWEB_LAN_IP:?Supply the private IP of this server}:8090:8090"
    environment:
      ASTROWEB_DATA: /data
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # Waitress and Werkzeug can spool up to 600 MiB per upload.
      TMPDIR: /data
      ASTROWEB_HOSTS: "localhost,127.0.0.1,astroweb.home.arpa,${ASTROWEB_LAN_IP}"
      ASTROWEB_OFFLINE: "${ASTROWEB_OFFLINE:-1}"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    stop_grace_period: 5m
